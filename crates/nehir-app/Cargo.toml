[package]
name = "nehir-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nehir — hızlı, çok bağlantılı indirme yöneticisi"

[[bin]]
name = "nehir"
path = "src/main.rs"

[features]
# Yayın sürümü: arayüzü gömülü dosyalardan sunar (yoksa devUrl'ye, yani localhost:5173'e bağlanmaya çalışır).
# Varsayılan açık: düz `cargo build --release` da doğru çalışan paket üretir.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
nehir-core = { path = "../nehir-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
url = "2"

[build-dependencies]
tauri-build = "2"
