name: Sürüm

# v* etiketi itilince Linux (.deb) ve Windows (NSIS kurulum) paketlerini derleyip GitHub sürümüne ekler.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb + eklenti)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential pkg-config curl
      - name: Arayüz ve eklenti
        run: |
          (cd ui && npm ci && npm run build)
          node extension/build.mjs
      - name: Derle ve paketle
        run: |
          cargo build --release -p nehir-app -p nehir-host
          packaging/build-deb.sh
          VERSION="${GITHUB_REF_NAME#v}"
          (cd extension/dist/chrome && zip -r "$GITHUB_WORKSPACE/dist/nehir-chrome-$VERSION.zip" .)
          (cd extension/dist/firefox && zip -r "$GITHUB_WORKSPACE/dist/nehir-firefox-$VERSION.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.zip

  windows:
    name: Windows (kurulum paketi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Kurulum paketi
        shell: pwsh
        run: packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe

  publish:
    name: Sürümü yayınla
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Özet dosyası ve sürüm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > sha256sums.txt
          cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VERSION]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "Nehir $GITHUB_REF_NAME" --notes-file notes.md
