<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nehir</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand" data-tauri-drag-region><img src="/src/logo.png" alt="" width="32" height="32"><span>Nehir</span></div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <button class="nav-item" id="btn-browser"><span class="ico" data-icon="plug"></span><span data-i18n="nav.browser"></span><i class="dot" id="browser-dot"></i></button>
        <button class="nav-item" id="btn-net"><span class="ico" data-icon="wifi"></span><span data-i18n="nav.network"></span><i class="dot" id="net-dot" hidden></i></button>
        <button class="nav-item" id="btn-settings"><span class="ico" data-icon="gear"></span><span data-i18n="nav.settings"></span></button>
      </div>
    </aside>

    <main>
      <header id="topbar" data-tauri-drag-region>
        <div class="search"><span class="ico" data-icon="search"></span><input id="search" type="search" data-i18n-ph="search"></div>
        <div class="spacer" data-tauri-drag-region></div>
        <div class="stat" id="total-speed"></div>
        <button class="icon-btn" id="btn-pause-all" data-i18n-title="pauseAll"><span class="ico" data-icon="pause"></span></button>
        <button class="icon-btn" id="btn-resume-all" data-i18n-title="resumeAll"><span class="ico" data-icon="play"></span></button>
        <button class="icon-btn" id="btn-clear" data-i18n-title="clearFinished"><span class="ico" data-icon="broom"></span></button>
        <button class="primary" id="btn-add"><span class="ico" data-icon="plus"></span><span data-i18n="add"></span></button>
        <div class="winctl" id="winctl" hidden>
          <button id="win-min" data-i18n-title="win.min"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <button id="win-max" data-i18n-title="win.max"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button id="win-close" class="close" data-i18n-title="win.close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div id="list" tabindex="0"></div>
      <div id="empty" hidden>
        <img src="/src/logo.png" width="72" height="72" alt="">
        <h2 data-i18n="empty.title"></h2>
        <p class="motto" data-i18n="motto"></p>
        <p data-i18n="empty.text"></p>
      </div>
    </main>
  </div>

  <dialog id="dlg-add">
    <form method="dialog" id="form-add">
      <h3 data-i18n="addDialog.title"></h3>
      <textarea id="add-urls" rows="5" spellcheck="false" data-i18n-ph="addDialog.placeholder"></textarea>
      <label class="check"><input type="checkbox" id="add-video"><span data-i18n="addDialog.video"></span></label>
      <div class="field" id="add-quality-field" hidden>
        <label for="add-quality" data-i18n="addDialog.quality"></label>
        <select id="add-quality"></select>
      </div>
      <p class="hint" data-i18n="addDialog.hint"></p>
      <div class="buttons">
        <button type="button" id="add-cancel" data-i18n="cancel"></button>
        <button type="submit" class="primary" data-i18n="addDialog.start"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-settings"><div id="settings-body"></div></dialog>
  <dialog id="dlg-net"><div id="net-body"></div></dialog>
  <dialog id="dlg-browser"><div id="browser-body"></div></dialog>
  <div id="toasts"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
